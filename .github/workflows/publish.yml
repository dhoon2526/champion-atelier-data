name: Sync and publish public champion data
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-champion-data
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Read latest public settings and validate privacy allowlist
        run: python3 scripts/sync.py
      - name: Save changed public JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add champions.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync latest public champion settings"
            git push
          fi
      - name: Prepare static-only publication
        run: |
          mkdir -p _site
          cp champions.json index.html .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
